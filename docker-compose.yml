services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_pass}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library_user} -d ${POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-library_user}:${POSTGRES_PASSWORD:-library_pass}@db:5432/${POSTGRES_DB:-library_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min10}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      MAX_ACTIVE_LOANS: ${MAX_ACTIVE_LOANS:-3}
      LOAN_DURATION_DAYS: ${LOAN_DURATION_DAYS:-14}
      FINE_PER_DAY: ${FINE_PER_DAY:-1000}
    ports:
      - "3001:3001"
    entrypoint: ["./docker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
